          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Erro de validação'
                    type: object
                    example:
                      success: false
                      message: 'Erro na validação dos dados'
                      errors:
                        name:
                          - 'O campo nome é obrigatório.'
                        price:
                          - 'O campo preço deve ser maior que 0.'
                        stock_quantity:
                          - 'O campo quantidade deve ser um número inteiro.'
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Erro na validação dos dados'
                      errors:
                        type: object
                        properties:
                          name:
                            type: array
                            example:
                              - 'O campo nome é obrigatório.'
                            items:
                              type: string
                          price:
                            type: array
                            example:
                              - 'O campo preço deve ser maior que 0.'
                            items:
                              type: string
                          stock_quantity:
                            type: array
                            example:
                              - 'O campo quantidade deve ser um número inteiro.'
                            items:
                              type: string
