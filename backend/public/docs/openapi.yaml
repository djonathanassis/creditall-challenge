openapi: 3.0.3
info:
  title: 'CreditAll Challenge API Documentation'
  description: 'API REST para gerenciamento de vendas, produtos e clientes do sistema CreditAll Challenge. Oferece funcionalidades completas de CRUD, controle de estoque, cálculo de descontos e gerenciamento de status de vendas.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: '🔐 Autenticação'
    description: "\nEndpoints para gerenciar autenticação de usuários na API.\nUtiliza Laravel Sanctum para autenticação baseada em tokens Bearer."
  -
    name: '📦 Produtos'
    description: "\nEndpoints para gerenciamento completo de produtos, incluindo CRUD, upload de imagens e controle de estoque.\nTodos os endpoints são protegidos por autenticação e possuem validação rigorosa de dados."
  -
    name: '👥 Clientes'
    description: "\nEndpoints para gerenciamento completo de clientes, incluindo CRUD, validação de CPF e estatísticas de vendas.\nTodos os endpoints são protegidos por autenticação."
  -
    name: '💰 Vendas'
    description: "\nEndpoints para gerenciamento completo de vendas com lógica de negócio complexa.\nInclui criação de vendas com múltiplos itens, controle de estoque, descontos e gestão de status.\n\n## Status de Vendas\n\nAs vendas seguem um fluxo de status bem definido:\n\n- **PENDING**: Venda criada, aguardando processamento\n- **COMPLETED**: Venda finalizada, estoque deduzido\n- **CANCELLED**: Venda cancelada, estoque restaurado\n\n## Transições de Status Permitidas\n\n- PENDING → COMPLETED: Confirma a venda e deduz estoque\n- PENDING → CANCELLED: Cancela a venda\n- COMPLETED → CANCELLED: Cancela venda finalizada (restaura estoque)\n\n## Lógica de Estoque\n\n- **Criação**: Reserva estoque (não deduz)\n- **COMPLETED**: Deduz estoque definitivamente\n- **CANCELLED**: Restaura estoque reservado/deduzido\n\n## Sistema de Descontos\n\n- Desconto percentual aplicado sobre o subtotal\n- Cálculo: subtotal - (subtotal * desconto / 100)\n- Validação automática de produtos e quantidades"
  -
    name: '🛠️ Utilitários'
    description: "\nEndpoints utilitários para monitoramento e verificação do sistema.\nInclui health check e informações de status da aplicação."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "## Autenticação\n\nEsta API usa **Laravel Sanctum** para autenticação baseada em tokens Bearer.\n\n### Como Obter um Token\n1. Faça login através do endpoint `POST /api/auth/login` com suas credenciais\n2. O token será retornado na resposta do login\n3. Use este token nas requisições subsequentes\n\n### Como Usar o Token\nInclua o token no header `Authorization` de todas as requisições protegidas:\n```\nAuthorization: Bearer {seu_token_aqui}\n```\n\n### Segurança\n- Os tokens não expiram automaticamente, mas podem ser revogados\n- Use `POST /api/auth/logout` para revogar o token atual\n- Mantenha seu token seguro e não o compartilhe\n- Em caso de comprometimento, faça logout e gere um novo token\n\n### Rate Limiting\n- **Login**: Limitado a 5 tentativas por minuto\n- **API Geral**: Limitado a 60 requisições por minuto por IP\n- **Usuário Autenticado**: Limitado a 1000 requisições por hora por usuário"
security:
  -
    default: []
paths:
  /api/auth/login:
    post:
      summary: 'Login de usuário'
      operationId: loginDeUsurio
      description: 'Autentica um usuário com email e senha, retornando as informações do usuário e um token de acesso.'
      parameters: []
      responses:
        200:
          description: 'Login bem-sucedido'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Login realizado com sucesso'
                  data:
                    user:
                      id: 1
                      name: 'João Silva'
                      email: joao@exemplo.com
                      email_verified_at: '2026-03-06T10:30:00.000000Z'
                      created_at: '2026-03-06T10:30:00.000000Z'
                      updated_at: '2026-03-06T10:30:00.000000Z'
                    token: 1|AbCdEfGhIjKlMnOpQrStUvWxYz1234567890abcdef
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login realizado com sucesso'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'João Silva'
                          email:
                            type: string
                            example: joao@exemplo.com
                          email_verified_at:
                            type: string
                            example: '2026-03-06T10:30:00.000000Z'
                          created_at:
                            type: string
                            example: '2026-03-06T10:30:00.000000Z'
                          updated_at:
                            type: string
                            example: '2026-03-06T10:30:00.000000Z'
                      token:
                        type: string
                        example: 1|AbCdEfGhIjKlMnOpQrStUvWxYz1234567890abcdef
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Credenciais inválidas'
                    type: object
                    example:
                      success: false
                      message: 'Erro na validação dos dados'
                      errors:
                        email:
                          - 'As credenciais fornecidas são inválidas.'
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Erro na validação dos dados'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'As credenciais fornecidas são inválidas.'
                            items:
                              type: string
                  -
                    description: 'Dados de validação inválidos'
                    type: object
                    example:
                      success: false
                      message: 'Erro na validação dos dados'
                      errors:
                        email:
                          - 'O campo email é obrigatório.'
                        password:
                          - 'O campo senha é obrigatório.'
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Erro na validação dos dados'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'O campo email é obrigatório.'
                            items:
                              type: string
                          password:
                            type: array
                            example:
                              - 'O campo senha é obrigatório.'
                            items:
                              type: string
      tags:
        - '🔐 Autenticação'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'O email do usuário. Deve ser um email válido.'
                  example: usuario@exemplo.com
                password:
                  type: string
                  description: 'A senha do usuário. Mínimo 8 caracteres.'
                  example: minhasenha123
              required:
                - email
                - password
      security: []
  /api/auth/logout:
    post:
      summary: 'Logout de usuário'
      operationId: logoutDeUsurio
      description: 'Revoga o token de acesso atual do usuário autenticado, efetuando logout da sessão.'
      parameters: []
      responses:
        200:
          description: 'Logout bem-sucedido'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Logout realizado com sucesso'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Logout realizado com sucesso'
                  data:
                    type: string
                    example: null
                    nullable: true
        401:
          description: 'Token inválido ou expirado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Token de acesso inválido ou expirado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Token de acesso inválido ou expirado'
      tags:
        - '🔐 Autenticação'
  /api/auth/me:
    get:
      summary: 'Informações do usuário autenticado'
      operationId: informaesDoUsurioAutenticado
      description: 'Retorna as informações completas do usuário atualmente autenticado.'
      parameters: []
      responses:
        200:
          description: 'Usuário autenticado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Dados recuperados com sucesso'
                  data:
                    id: 1
                    name: 'João Silva'
                    email: joao@exemplo.com
                    email_verified_at: '2026-03-06T10:30:00.000000Z'
                    created_at: '2026-03-06T10:30:00.000000Z'
                    updated_at: '2026-03-06T10:30:00.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Dados recuperados com sucesso'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'João Silva'
                      email:
                        type: string
                        example: joao@exemplo.com
                      email_verified_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
                      created_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
        401:
          description: 'Token inválido ou expirado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Token de acesso inválido ou expirado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Token de acesso inválido ou expirado'
      tags:
        - '🔐 Autenticação'
  /api/products:
    get:
      summary: 'Listar produtos'
      operationId: listarProdutos
      description: "Retorna uma lista paginada de produtos com opções de filtro e busca.\nSuporta filtros por nome, categoria e faixa de preço."
      parameters:
        -
          in: query
          name: search
          description: 'Filtro de busca por nome do produto.'
          example: notebook
          required: false
          schema:
            type: string
            description: 'Filtro de busca por nome do produto.'
            example: notebook
        -
          in: query
          name: min_price
          description: 'Preço mínimo para filtrar produtos.'
          example: 100.0
          required: false
          schema:
            type: number
            description: 'Preço mínimo para filtrar produtos.'
            example: 100.0
        -
          in: query
          name: max_price
          description: 'Preço máximo para filtrar produtos.'
          example: 1000.0
          required: false
          schema:
            type: number
            description: 'Preço máximo para filtrar produtos.'
            example: 1000.0
        -
          in: query
          name: per_page
          description: 'Número de itens por página (padrão: 15, máximo: 100).'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Número de itens por página (padrão: 15, máximo: 100).'
            example: 20
        -
          in: query
          name: page
          description: 'Página a ser exibida (padrão: 1).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Página a ser exibida (padrão: 1).'
            example: 1
      responses:
        200:
          description: 'Lista de produtos'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Dados recuperados com sucesso'
                  data:
                    -
                      id: 1
                      name: 'Notebook Dell Inspiron'
                      description: 'Notebook Dell com processador i7 e 16GB RAM'
                      price: '2499.99'
                      stock_quantity: 15
                      image_url: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                      created_at: '2026-03-06T10:30:00.000000Z'
                      updated_at: '2026-03-06T10:30:00.000000Z'
                    -
                      id: 2
                      name: 'Mouse Logitech MX'
                      description: 'Mouse sem fio com precisão óptica'
                      price: '199.90'
                      stock_quantity: 50
                      image_url: 'http://localhost:8080/storage/products/mouse_logitech.jpg'
                      created_at: '2026-03-06T11:00:00.000000Z'
                      updated_at: '2026-03-06T11:00:00.000000Z'
                  meta:
                    current_page: 1
                    per_page: 15
                    total: 50
                    last_page: 4
                    from: 1
                    to: 15
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Dados recuperados com sucesso'
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Notebook Dell Inspiron'
                        description: 'Notebook Dell com processador i7 e 16GB RAM'
                        price: '2499.99'
                        stock_quantity: 15
                        image_url: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                        created_at: '2026-03-06T10:30:00.000000Z'
                        updated_at: '2026-03-06T10:30:00.000000Z'
                      -
                        id: 2
                        name: 'Mouse Logitech MX'
                        description: 'Mouse sem fio com precisão óptica'
                        price: '199.90'
                        stock_quantity: 50
                        image_url: 'http://localhost:8080/storage/products/mouse_logitech.jpg'
                        created_at: '2026-03-06T11:00:00.000000Z'
                        updated_at: '2026-03-06T11:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Notebook Dell Inspiron'
                        description:
                          type: string
                          example: 'Notebook Dell com processador i7 e 16GB RAM'
                        price:
                          type: string
                          example: '2499.99'
                        stock_quantity:
                          type: integer
                          example: 15
                        image_url:
                          type: string
                          example: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                        created_at:
                          type: string
                          example: '2026-03-06T10:30:00.000000Z'
                        updated_at:
                          type: string
                          example: '2026-03-06T10:30:00.000000Z'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 50
                      last_page:
                        type: integer
                        example: 4
                      from:
                        type: integer
                        example: 1
                      to:
                        type: integer
                        example: 15
        401:
          description: 'Token inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Token de acesso inválido ou expirado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Token de acesso inválido ou expirado'
      tags:
        - '📦 Produtos'
    post:
      summary: 'Criar produto'
      operationId: criarProduto
      description: "Cria um novo produto no sistema com validação completa de dados.\nSuporta upload de imagem opcional."
      parameters: []
      responses:
        201:
          description: 'Produto criado com sucesso'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Produto criado com sucesso'
                  data:
                    id: 1
                    name: 'Notebook Dell Inspiron'
                    description: 'Notebook Dell com processador i7, 16GB RAM e SSD 512GB'
                    price: '2499.99'
                    stock_quantity: 15
                    image_url: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                    created_at: '2026-03-06T10:30:00.000000Z'
                    updated_at: '2026-03-06T10:30:00.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Produto criado com sucesso'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Notebook Dell Inspiron'
                      description:
                        type: string
                        example: 'Notebook Dell com processador i7, 16GB RAM e SSD 512GB'
                      price:
                        type: string
                        example: '2499.99'
                      stock_quantity:
                        type: integer
                        example: 15
                      image_url:
                        type: string
                        example: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                      created_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
