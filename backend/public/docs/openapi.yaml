                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Erro na validação dos dados'
                      errors:
                        type: object
                        properties:
                          name:
                            type: array
                            example:
                              - 'O produto com este nome já existe.'
                            items:
                              type: string
      tags:
        - '📦 Produtos'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome do produto. Deve ser único.'
                  example: 'Notebook Dell Inspiron'
                description:
                  type: string
                  description: 'Descrição detalhada do produto.'
                  example: 'Notebook Dell com processador i7, 16GB RAM e SSD 512GB'
                  nullable: true
                price:
                  type: number
                  description: 'Preço do produto (máximo 2 decimais). Deve ser maior que 0.'
                  example: 2499.99
                stock_quantity:
                  type: integer
                  description: 'Quantidade em estoque. Deve ser >= 0.'
                  example: 15
                image:
                  type: string
                  format: binary
                  description: 'Imagem do produto. Formatos aceitos: jpg, jpeg, png, gif. Tamanho máximo: 2MB.'
                  nullable: true
              required:
                - name
                - description
                - price
                - stock_quantity
  '/api/products/{id}':
    get:
      summary: 'Exibir produto'
      operationId: exibirProduto
      description: 'Retorna os detalhes completos de um produto específico.'
      parameters: []
      responses:
        200:
          description: 'Produto encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Dados recuperados com sucesso'
                  data:
                    id: 1
                    name: 'Notebook Dell Inspiron'
                    description: 'Notebook Dell com processador i7, 16GB RAM e SSD 512GB'
                    price: '2499.99'
                    stock_quantity: 15
                    image_url: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                    created_at: '2026-03-06T10:30:00.000000Z'
                    updated_at: '2026-03-06T10:30:00.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Dados recuperados com sucesso'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Notebook Dell Inspiron'
                      description:
                        type: string
                        example: 'Notebook Dell com processador i7, 16GB RAM e SSD 512GB'
                      price:
                        type: string
                        example: '2499.99'
                      stock_quantity:
                        type: integer
                        example: 15
                      image_url:
                        type: string
                        example: 'http://localhost:8080/storage/products/notebook_dell.jpg'
                      created_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
        404:
          description: 'Produto não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Produto não encontrado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Produto não encontrado'
      tags:
        - '📦 Produtos'
    put:
      summary: 'Atualizar produto'
      operationId: atualizarProduto
      description: "Atualiza os dados de um produto existente.\nPermite atualização parcial dos campos e substituição da imagem."
      parameters: []
      responses:
        200:
          description: 'Produto atualizado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Produto atualizado com sucesso'
                  data:
                    id: 1
                    name: 'Notebook Dell Inspiron 15'
                    description: 'Notebook Dell com processador i7 atualizado'
                    price: '2699.99'
                    stock_quantity: 20
                    image_url: 'http://localhost:8080/storage/products/notebook_dell_updated.jpg'
                    created_at: '2026-03-06T10:30:00.000000Z'
                    updated_at: '2026-03-06T12:30:00.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Produto atualizado com sucesso'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Notebook Dell Inspiron 15'
                      description:
                        type: string
                        example: 'Notebook Dell com processador i7 atualizado'
                      price:
                        type: string
                        example: '2699.99'
                      stock_quantity:
                        type: integer
                        example: 20
                      image_url:
                        type: string
                        example: 'http://localhost:8080/storage/products/notebook_dell_updated.jpg'
                      created_at:
                        type: string
                        example: '2026-03-06T10:30:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-03-06T12:30:00.000000Z'
        404:
          description: 'Produto não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Produto não encontrado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Produto não encontrado'
        422:
          description: 'Erro de validação'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Erro na validação dos dados'
                  errors:
                    name:
                      - 'O produto com este nome já existe.'
                    price:
                      - 'O campo preço deve ser maior que 0.'
                properties:
                  success:
                    type: boolean
                    example: false
