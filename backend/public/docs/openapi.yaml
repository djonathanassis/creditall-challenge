    delete:
      summary: 'Excluir venda'
      operationId: excluirVenda
      description: "Remove uma venda do sistema com todas as suas validações e impactos.\n\n## Processo de Exclusão\n1. Verifica se a venda pode ser excluída\n2. Restaura estoque se necessário (dependendo do status)\n3. Remove itens da venda\n4. Remove a venda\n\n## Regras de Negócio\n- Vendas PENDING: Remove e libera estoque reservado\n- Vendas COMPLETED: Remove e restaura estoque deduzido\n- Vendas CANCELLED: Remove sem impacto no estoque\n\n## Impacto no Estoque\n- **PENDING**: Libera estoque reservado\n- **COMPLETED**: Adiciona de volta ao estoque\n- **CANCELLED**: Sem alteração (já estava liberado)"
      parameters: []
      responses:
        200:
          description: 'Venda excluída'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Venda excluída com sucesso'
                  data: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Venda excluída com sucesso'
                  data:
                    type: string
                    example: null
                    nullable: true
        400:
          description: 'Falha na exclusão'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Falha ao criar a venda'
                  errors:
                    details: 'Erro específico do sistema'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Falha ao criar a venda'
                  errors:
                    type: object
                    properties:
                      details:
                        type: string
                        example: 'Erro específico do sistema'
        404:
          description: 'Venda não encontrada'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Venda não encontrada'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Venda não encontrada'
      tags:
        - '💰 Vendas'
    parameters:
      -
        in: path
        name: id
        description: 'ID da venda.'
        example: 1
        required: true
        schema:
          type: integer
