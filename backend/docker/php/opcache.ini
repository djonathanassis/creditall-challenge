[opcache]
; Disable OPcache for development (enable file changes detection)
opcache.enable=0

; Disable OPcache for CLI in development
opcache.enable_cli=0

; Memory consumption (MB) - smaller for dev
opcache.memory_consumption=128

; The amount of memory for interned strings (MB)
opcache.interned_strings_buffer=8

; Maximum number of accelerated files
opcache.max_accelerated_files=10000

; Validate timestamps - ENABLE for development
opcache.validate_timestamps=1

; How often to check file timestamps for changes (seconds)
; 0 = check on every request (good for development)
opcache.revalidate_freq=0

; Save comments in OPcache (required for Laravel)
opcache.save_comments=1

; Enable fast shutdown
opcache.fast_shutdown=1

; Disable file cache in development
;opcache.file_cache=/tmp

; Development note: OPcache is disabled to allow real-time code changes
; Enable it in production for better performance